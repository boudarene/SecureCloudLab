services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: securecloud-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
      - app_net
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./app
    container_name: securecloud-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secureuser}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-securecloud}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - app_net
      - db_net
      - monitoring_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    container_name: securecloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securecloud}
      POSTGRES_USER: ${POSTGRES_USER:-secureuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secureuser} -d ${POSTGRES_DB:-securecloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: securecloud-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring_net
      - prometheus_access
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  prometheus_data:

networks:
  frontend:
    driver: bridge
  app_net:
    driver: bridge
    internal: true
  db_net:
    driver: bridge
    internal: true
  monitoring_net:
    driver: bridge
    internal: true
  prometheus_access:
    driver: bridge
